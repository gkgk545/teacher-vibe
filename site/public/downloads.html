<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예비 자료 · 바이브코딩 연수</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <h1>예비 자료</h1>
  <div class="hero-actions" id="zips"></div>
</main>
<script src="/js/content.js"></script>
<script src="/js/common.js"></script>
<script>
(function () {
  const C = window.CONTENT, el = window.SITE.el;
  document.getElementById('zips').replaceChildren(...C.downloads.map((d) => el('a', { class: 'btn primary', href: d.file, download: d.label }, [
    d.label, el('span', { class: 'small', style: 'font-weight:400', text: ' · ' + d.who }),
  ])));
})();
</script>
</body>
</html>
