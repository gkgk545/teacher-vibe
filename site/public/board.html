<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공유 게시판 · 바이브코딩 연수</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <!-- 입장 코드 -->
  <section id="entry" class="card entry" hidden>
    <h1 id="entry-title">공유 게시판</h1>
    <p class="muted" id="entry-help">연수장에서 안내한 입장 코드를 넣어 주세요.</p>
    <form id="entry-form">
      <div class="field">
        <label for="entry-code" id="entry-label">입장 코드</label>
        <input id="entry-code" type="text" inputmode="numeric" autocomplete="off" required>
      </div>
      <p class="form-error" id="entry-error"></p>
      <button class="btn primary big" type="submit" style="width:100%">들어가기</button>
    </form>
  </section>

  <!-- 게시판 -->
  <section id="board" hidden>
    <div class="board-bar">
      <h1 id="board-title">공유 게시판</h1>
      <button class="btn primary" type="button" id="open-compose">앱 올리기</button>
    </div>
    <div class="note blue"><p id="board-notice"></p></div>
    <div id="admin-bar" class="note pink" hidden>
      <p><b>관리 모드</b> · 글과 댓글에 삭제 버튼이 보입니다.
        <button class="btn small danger" type="button" id="clear-board">이 게시판 모두 비우기</button>
        <button class="btn small" type="button" id="admin-exit">관리 모드 끝내기</button></p>
    </div>

    <form id="compose" class="card compose" hidden>
      <h2 style="margin-top:0">앱 올리기</h2>
      <div class="field">
        <label for="f-name">이름</label>
        <input id="f-name" name="name" type="text" maxlength="20" required>
      </div>
      <div class="field">
        <label for="f-app">앱 이름</label>
        <input id="f-app" name="app_name" type="text" maxlength="40" required>
      </div>
      <div class="field">
        <label for="f-subject">교과·학년</label>
        <input id="f-subject" name="subject" type="text" maxlength="30" placeholder="예: 과학 2학년" required>
      </div>
      <div class="field">
        <label for="f-intro">한 줄 소개</label>
        <input id="f-intro" name="intro" type="text" maxlength="200" required>
      </div>
      <div class="field">
        <span style="font-weight:700;font-size:.95rem">앱을 올리는 방법</span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="kind" value="link" checked>배포 주소</label>
          <label><input type="radio" name="kind" value="file">HTML 파일</label>
        </div>
      </div>
      <div class="field" id="link-field">
        <label for="f-link">배포 주소</label>
        <input id="f-link" name="link" type="url" inputmode="url" placeholder="https://" maxlength="500">
      </div>
      <div class="field" id="file-field" hidden>
        <label for="f-file">HTML 파일</label>
        <input id="f-file" name="file" type="file" accept=".html,text/html">
        <span class="hint">.html 파일 하나, 1MB까지. 학생 개인정보가 든 파일은 올리지 않습니다.</span>
      </div>
      <p class="form-error" id="compose-error"></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" type="submit" id="compose-submit">올리기</button>
        <button class="btn" type="button" id="compose-cancel">닫기</button>
      </div>
    </form>

    <div id="posts" class="posts"></div>
    <p id="empty" class="empty" hidden>아직 올라온 앱이 없습니다. 첫 앱을 올려 주세요.</p>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="/js/content.js"></script>
<script src="/js/common.js"></script>
<script src="/js/board.js"></script>
</body>
</html>
