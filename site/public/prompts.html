<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복사할 프롬프트 · 바이브코딩 연수</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <h1>복사할 프롬프트</h1>
  <div id="prompts"></div>
</main>
<script src="/js/source.js"></script>
<script src="/js/content.js"></script>
<script src="/js/common.js"></script>
<script>
document.getElementById('prompts').replaceChildren(...window.SOURCE.prompts.concat(
  window.SOURCE.extras.map((e) => ({ name: e.name, blocks: [{ label: '', text: e.text }] })),
).map((p) => window.SITE.promptBox(p)));
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>
