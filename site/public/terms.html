<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>용어 정리 · 바이브코딩 연수</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <h1>용어 정리</h1>
  <p class="lead">AI 코딩 앱에서 자주 보는 말을 네 묶음으로 모았습니다.</p>
  <div class="term-groups" id="terms"></div>
  <p class="note pink">학생에게 앱을 쓰게 하기 전에는 <a href="/guide.html#committee">학교운영위원회 심의</a>가 필요한지 학교 담당자와 확인합니다.</p>
</main>
<footer id="site-footer"></footer>
<script src="/js/source.js"></script>
<script src="/js/content.js"></script>
<script src="/js/common.js"></script>
<script>
(function () {
  const S = window.SITE, el = S.el;
  document.getElementById('terms').replaceChildren(...window.SOURCE.terms.map((g) => el('section', { class: 'card term-group' }, [
    el('h3', { text: g.group }),
    el('dl', {}, g.items.flatMap((t) => [
      el('dt', { text: t.term }),
      S.html('dd', '', t.desc),
      S.html('dd', 'analogy', '<span>교실 비유</span> ' + t.analogy),
    ])),
    S.html('div', 'term-notes', g.notes),
  ])));
})();
</script>
</body>
</html>
